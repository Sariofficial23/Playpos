# Сборка установщика PlayPos для Windows. Готовый PlayPos-Setup-*.exe появляется в Releases репозитория,
# latest.yml из последнего релиза — источник автообновлений для установленных программ.
name: Desktop app (Windows)

on:
  push:
    branches: [ccr-c1e6b03e-moq1qv, main]
    paths: ["desktop/**", "lib/**", "api/**", "demo/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      # Каждая сборка — новая версия (1.3.N): по ней установленные программы понимают, что есть обновление
      - name: Version
        working-directory: desktop
        run: npm version 1.3.${{ github.run_number }} --no-git-tag-version
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win
      # Копия с постоянным именем: ссылка .../releases/latest/download/PlayPos-Setup.exe всегда ведёт на последнюю версию
      - name: Stable file name
        shell: pwsh
        run: Copy-Item (Get-ChildItem desktop/dist/PlayPos-Setup-*.exe | Select-Object -First 1).FullName desktop/dist/PlayPos-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PlayPos-Setup
          path: desktop/dist/*.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: PlayPos для Windows — сборка ${{ github.run_number }}
          body: Установщик кассы PlayPos для Windows (касса + сервер + база на одном компьютере). Установленные программы обновятся сами через интернет (latest.yml).
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          make_latest: true
