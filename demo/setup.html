<!doctype html>
<html lang="ru" data-palette="jungle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayPos — установка</title>
<link rel="stylesheet" href="fonts/nunito.css">
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="login"><div class="login-box">
  <a class="logo" href="index.html"><span class="logo-mark"><svg width="18" height="20" viewBox="0 0 18 20"><path d="M3 2.5c0-1.2 1.3-1.9 2.3-1.3l11 7.5c.9.6.9 2 0 2.6l-11 7.5C4.3 19.4 3 18.7 3 17.5z" fill="#fff"/></svg></span><span>Play<b>Pos</b></span></a>
  <h2 style="margin:18px 0 6px">Установка площадки</h2>
  <p style="color:var(--muted);margin:0 0 6px">Один раз: создаём площадку и учётную запись владельца.</p>
  <form id="f">
    <div id="tokenBox"><label class="lb">Код установки</label><input class="input" name="token" type="password" style="width:100%"></div>
    <label class="lb">Название площадки</label><input class="input" name="venue" maxlength="60" required style="width:100%" placeholder="Например, Kids Jungle — Чиланзар">
    <label class="lb">Имя владельца</label><input class="input" name="name" maxlength="40" required style="width:100%">
    <label class="lb">Логин владельца (латиница)</label><input class="input" name="login" maxlength="30" required autocapitalize="off" pattern="[A-Za-z0-9._\-]{2,30}" style="width:100%">
    <label class="lb">Пароль (минимум 6 символов)</label><input class="input" name="password" type="password" minlength="6" required autocomplete="new-password" style="width:100%">
    <button class="btn big" type="submit">Создать площадку</button>
  </form>
  <p id="msg" style="font-weight:800;margin-top:12px"></p>
</div></div>
<style>.lb { display: block; font-weight: 800; font-size: 14px; margin: 12px 0 6px; }</style>
<script>
  const post = (body) => fetch("/api/rpc", { method: "POST", headers: { "Content-Type": "application/json", "X-PlayPos": "1" }, body: JSON.stringify(body) });
  // В настольном приложении код установки не нужен; если площадка уже есть — сразу в кассу
  post({ op: "info" }).then((r) => r.json()).then((i) => {
    if (i.desktop && i.license && !i.license.activated) return (location.href = "activate");
    if (!i.needsSetup) return (location.href = "pos");
    if (i.desktop) document.getElementById("tokenBox").remove();
    if (i.license && i.license.venue) document.querySelector("[name=venue]").value = i.license.venue;
  }).catch(() => {});
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button"), msg = document.getElementById("msg");
    btn.disabled = true; msg.textContent = "";
    const data = Object.fromEntries(new FormData(e.target));
    try {
      const r = await post({ op: "setup", ...data });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || "Ошибка");
      msg.style.color = "var(--ok)"; msg.textContent = "Готово! Открываем кассу…";
      setTimeout(() => (location.href = "pos"), 800);
    } catch (err) {
      msg.style.color = "var(--danger)"; msg.textContent = err.message; btn.disabled = false;
    }
  };
</script>
</body>
</html>
