<!doctype html>
<html lang="ru" data-palette="jungle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayPos — активация</title>
<link rel="stylesheet" href="fonts/nunito.css">
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="login"><div class="login-box">
  <a class="logo"><span class="logo-mark"><svg width="18" height="20" viewBox="0 0 18 20"><path d="M3 2.5c0-1.2 1.3-1.9 2.3-1.3l11 7.5c.9.6.9 2 0 2.6l-11 7.5C4.3 19.4 3 18.7 3 17.5z" fill="#fff"/></svg></span><span>Play<b>Pos</b></span></a>
  <div style="float:right;margin-top:6px" id="langsw"></div>
  <h2 style="margin:18px 0 6px">Активация программы</h2>
  <p style="color:var(--muted);margin:0 0 6px">Введите логин и пароль, которые выдал PlayPos. Нужен интернет — только для активации, дальше касса работает и без него.</p>
  <form id="f">
    <label class="lb">Логин</label><input class="input" name="login" required autocapitalize="off" spellcheck="false" style="width:100%" autofocus>
    <label class="lb">Пароль</label><input class="input" name="password" type="password" required style="width:100%">
    <button class="btn big" type="submit">Активировать</button>
  </form>
  <p id="msg" style="font-weight:800;margin-top:12px"></p>
</div></div>
<style>.lb { display: block; font-weight: 800; font-size: 14px; margin: 12px 0 6px; }</style>
<script>
  document.getElementById("langsw").innerHTML = PPI18N.switcher();
  const post = (body) => fetch("/api/rpc", { method: "POST", headers: { "Content-Type": "application/json", "X-PlayPos": "1" }, body: JSON.stringify(body) });
  post({ op: "info" }).then((r) => r.json()).then((i) => {
    if (!i.desktop || (i.license && i.license.activated)) location.href = i.needsSetup ? "setup" : "pos";
  }).catch(() => {});
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button"), msg = document.getElementById("msg");
    btn.disabled = true; msg.textContent = "";
    try {
      const r = await post({ op: "device.activate", ...Object.fromEntries(new FormData(e.target)) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || "Ошибка");
      msg.style.color = "var(--ok)"; msg.textContent = PPI18N.tr("Программа активирована");
      const info = await (await post({ op: "info" })).json();
      setTimeout(() => (location.href = info.needsSetup ? "setup" : "pos"), 700);
    } catch (err) {
      msg.style.color = "var(--danger)"; msg.textContent = PPI18N.tr(err.message); btn.disabled = false;
    }
  };
</script>
</body>
</html>
